name: Build NXbox Pack
on:
  push:
    branches: [main, codex/packer, team/t27-pack-gui]
    paths:
      - tools/nxbox-pack/**
      - tools/nxbox-pack-gui/**
      - dist/nxbox/AppxManifest.xml
      - .github/workflows/nxbox-pack.yml
  pull_request:
    paths:
      - tools/nxbox-pack/**
      - tools/nxbox-pack-gui/**
      - dist/nxbox/AppxManifest.xml
      - .github/workflows/nxbox-pack.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            script: build:windows
            binary: nxbox-pack-windows-x64.exe
            core: nxbox-pack.exe
            gui: nxbox-pack-gui.exe
            bundle: NXbox-Pack-windows-x64
          - os: macos-15
            script: build:macos
            binary: nxbox-pack-macos-arm64
            core: nxbox-pack
            gui: nxbox-pack-gui
            bundle: NXbox-Pack-macos-arm64
          - os: ubuntu-24.04
            script: build:linux
            binary: nxbox-pack-linux-x64
            core: nxbox-pack
            gui: nxbox-pack-gui
            bundle: NXbox-Pack-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/nxbox-pack
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run ${{ matrix.script }}
      - name: Smoke test compiled binary in both languages
        shell: bash
        run: |
          NXBOX_PACK_LANG=en ./dist/${{ matrix.binary }} --help
          NXBOX_PACK_LANG=pt ./dist/${{ matrix.binary }} --help
      - name: Record binary checksum
        env:
          NXBOX_PACK_BINARY: ${{ matrix.binary }}
        run: |
          bun -e "const name=process.env.NXBOX_PACK_BINARY; const path='dist/'+name; await Bun.write(path+'.sha256',new Bun.CryptoHasher('sha256').update(await Bun.file(path).arrayBuffer()).digest('hex')+'  '+name+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          if-no-files-found: error
          path: |
            tools/nxbox-pack/dist/${{ matrix.binary }}
            tools/nxbox-pack/dist/${{ matrix.binary }}.sha256
      # One Rust codebase builds the window on all three systems; the core binary sits next to it.
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - name: Build GUI and bundle it with the core
        shell: bash
        working-directory: tools/nxbox-pack-gui
        run: |
          cargo build --release --locked
          mkdir -p ../nxbox-pack/dist/bundle
          cp target/release/${{ matrix.gui }} ../nxbox-pack/dist/bundle/
          cp ../nxbox-pack/dist/${{ matrix.binary }} ../nxbox-pack/dist/bundle/${{ matrix.core }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}
          if-no-files-found: error
          path: tools/nxbox-pack/dist/bundle/
